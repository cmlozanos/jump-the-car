<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="80"/>
  
  <!-- Coche Monster Truck -->
  <g transform="translate(256, 300)">
    <!-- Cuerpo principal del coche -->
    <rect x="-120" y="-80" width="240" height="140" rx="15" fill="url(#carGradient)" stroke="#2d3436" stroke-width="6"/>
    
    <!-- Ventanas -->
    <rect x="-100" y="-70" width="50" height="40" rx="5" fill="#87ceeb" opacity="0.8"/>
    <rect x="50" y="-70" width="50" height="40" rx="5" fill="#87ceeb" opacity="0.8"/>
    
    <!-- Detalles del coche -->
    <rect x="-120" y="-60" width="240" height="8" fill="#2d3436" opacity="0.3"/>
    <rect x="-120" y="20" width="240" height="8" fill="#2d3436" opacity="0.3"/>
    
    <!-- Ruedas grandes de Monster Truck -->
    <circle cx="-80" cy="60" r="45" fill="#2d3436"/>
    <circle cx="80" cy="60" r="45" fill="#2d3436"/>
    <circle cx="-80" cy="60" r="35" fill="#555"/>
    <circle cx="80" cy="60" r="35" fill="#555"/>
    <circle cx="-80" cy="60" r="20" fill="#2d3436"/>
    <circle cx="80" cy="60" r="20" fill="#2d3436"/>
    
    <!-- Llantas -->
    <circle cx="-80" cy="60" r="12" fill="#FFD700"/>
    <circle cx="80" cy="60" r="12" fill="#FFD700"/>
  </g>
  
  <!-- Texto "JUMP" estilizado -->
  <text x="256" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#2d3436" text-anchor="middle" opacity="0.9">JUMP</text>
  
  <!-- Estrellas decorativas -->
  <g fill="#FFD700" opacity="0.8">
    <path d="M 100 100 L 110 130 L 140 130 L 115 150 L 125 180 L 100 160 L 75 180 L 85 150 L 60 130 L 90 130 Z"/>
    <path d="M 412 100 L 422 130 L 452 130 L 427 150 L 437 180 L 412 160 L 387 180 L 397 150 L 372 130 L 402 130 Z"/>
  </g>
</svg>
