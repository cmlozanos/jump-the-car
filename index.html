<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jump the Car">
    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="Un juego educativo y divertido para niños donde deben ayudar a un coche a saltar sobre obstáculos y llegar a la meta">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Iconos para PWA -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <title>Jump the Car</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Jump the Car</h1>
        </div>
        
        <div class="main-content">
            <!-- Panel de selección de coche -->
            <div class="car-selection-panel" id="carSelectionPanel">
                <h2>Elige tu coche</h2>
                <div class="cars-grid" id="carsGrid"></div>
            </div>

            <!-- Panel de selección de niveles -->
            <div class="level-selection-panel" id="levelSelectionPanel" style="display: none;">
                <h2>Selecciona un Nivel</h2>
                <div class="levels-grid" id="levelsGrid"></div>
            </div>

            <!-- Panel de juego -->
            <div class="game-panel" id="gamePanel" style="display: none;">
                <canvas id="gameCanvas" width="1200" height="600"></canvas>
                <!-- Botones HTML por encima del canvas y mensajes -->
                <button id="changeCarButton" class="canvas-button change-car-button-html" style="display: none;">
                    <img src="" alt="Cambiar coche" class="button-sprite">
                </button>
                <button id="configButton" class="canvas-button config-button-html" style="display: none;">
                    <img src="" alt="Configuración" class="button-sprite">
                </button>
                <button id="changeLevelButton" class="canvas-button change-level-button-html" style="display: none;">
                    <img src="" alt="Cambiar nivel" class="button-sprite">
                </button>
            </div>
        </div>

        <!-- Mensaje de victoria/derrota -->
        <div class="message-overlay" id="messageOverlay" style="display: none;">
            <div class="message-content">
                <h2 id="messageTitle"></h2>
                <p id="messageText"></p>
                <button id="nextLevelButton" style="display: none;">Siguiente Nivel</button>
                <button id="retryButton">Intentar de Nuevo</button>
                <button id="restartFromLevel1Button" style="display: none;">🔄 Reiniciar desde el Nivel 1</button>
            </div>
        </div>

        <!-- Panel de configuración -->
        <div class="config-overlay" id="configOverlay" style="display: none;">
            <div class="config-content">
                <h2><img src="" alt="Configuración" class="config-title-icon"> Configuración</h2>
                <div class="config-section">
                    <h3>Velocidad del Vehículo</h3>
                    <div class="speed-controls">
                        <button id="accelerateButton" class="config-button accelerate-btn">
                            <img src="" alt="Acelerar" class="button-icon-img">
                            <span class="button-label">Acelerar</span>
                        </button>
                        <div class="speed-display">
                            <span id="currentSpeedDisplay">15 km/h</span>
                        </div>
                        <button id="decelerateButton" class="config-button decelerate-btn">
                            <img src="" alt="Desacelerar" class="button-icon-img">
                            <span class="button-label">Desacelerar</span>
                        </button>
                    </div>
                </div>
                <button id="closeConfigButton" class="config-close-button">
                    <img src="" alt="Cerrar" class="close-icon-img">
                    Cerrar
                </button>
            </div>
        </div>

        <!-- Versión de la aplicación (discreta) -->
        <div class="version-info" id="versionInfo">v<span id="versionNumber"></span></div>
    </div>

    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker registrado exitosamente:', registration.scope);
                        
                        // Verificar actualizaciones periódicamente
                        setInterval(() => {
                            registration.update();
                        }, 60000); // Cada minuto
                        
                        // Manejar actualizaciones del Service Worker
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Hay una nueva versión disponible
                                    console.log('Nueva versión disponible. Recarga la página para actualizar.');
                                    // Opcional: mostrar notificación al usuario
                                    if (confirm('Hay una nueva versión disponible. ¿Deseas recargar la página?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.error('Error al registrar Service Worker:', error);
                    });
            });
        }
        
        // Cargar script con versionado para evitar caché
        (function() {
            const APP_VERSION = '1.4.0';
            const script = document.createElement('script');
            script.src = 'game.js?v=' + APP_VERSION;
            script.async = false;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
