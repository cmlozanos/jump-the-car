<svg width="60" height="50" xmlns="http://www.w3.org/2000/svg">
  <!-- Monster Truck estilo Hot Wheels - Rojo con llamas -->
  <!-- Cuerpo principal -->
  <rect x="5" y="15" width="50" height="20" fill="#dc143c" rx="3"/>
  <!-- Cabina -->
  <rect x="12" y="8" width="18" height="12" fill="#8b0000" rx="2"/>
  <!-- Ventana -->
  <rect x="14" y="10" width="14" height="8" fill="#1e90ff" rx="1"/>
  <!-- Brillo ventana -->
  <rect x="16" y="11" width="4" height="3" fill="rgba(255,255,255,0.6)"/>
  <!-- Ruedas grandes (monster truck) -->
  <circle cx="12" cy="42" r="10" fill="#1a1a1a"/>
  <circle cx="48" cy="42" r="10" fill="#1a1a1a"/>
  <!-- Detalles de ruedas -->
  <circle cx="12" cy="42" r="7" fill="#333"/>
  <circle cx="48" cy="42" r="7" fill="#333"/>
  <circle cx="12" cy="42" r="4" fill="#555"/>
  <circle cx="48" cy="42" r="4" fill="#555"/>
  <!-- Llamas decorativas -->
  <path d="M 20 20 L 25 18 L 30 20 L 28 25 L 20 25 Z" fill="#ff4500"/>
  <path d="M 30 20 L 35 18 L 40 20 L 38 25 L 30 25 Z" fill="#ff8c00"/>
  <!-- Número de carreras -->
  <text x="30" y="28" font-family="Arial Black" font-size="8" fill="#ffd700" text-anchor="middle" font-weight="bold">1</text>
  <!-- Suspensión -->
  <rect x="8" y="32" width="3" height="8" fill="#444"/>
  <rect x="49" y="32" width="3" height="8" fill="#444"/>
</svg>
