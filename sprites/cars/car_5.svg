<svg width="60" height="50" xmlns="http://www.w3.org/2000/svg">
  <!-- Monster Truck estilo Hot Wheels - Multicolor arcoíris -->
  <!-- Definir gradiente multicolor -->
  <defs>
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="16.66%" style="stop-color:#ff7f00;stop-opacity:1" />
      <stop offset="33.33%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="66.66%" style="stop-color:#0000ff;stop-opacity:1" />
      <stop offset="83.33%" style="stop-color:#4b0082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9400d3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainbowGradientVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff7f00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0000ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cuerpo principal con gradiente multicolor -->
  <rect x="5" y="15" width="50" height="20" fill="url(#rainbowGradient)" rx="3"/>
  
  <!-- Cabina con gradiente vertical -->
  <rect x="12" y="8" width="18" height="12" fill="url(#rainbowGradientVertical)" rx="2"/>
  
  <!-- Ventana -->
  <rect x="14" y="10" width="14" height="8" fill="#1e90ff" rx="1"/>
  <!-- Brillo ventana -->
  <rect x="16" y="11" width="4" height="3" fill="rgba(255,255,255,0.6)"/>
  
  <!-- Ruedas grandes (monster truck) -->
  <circle cx="12" cy="42" r="10" fill="#1a1a1a"/>
  <circle cx="48" cy="42" r="10" fill="#1a1a1a"/>
  <!-- Detalles de ruedas -->
  <circle cx="12" cy="42" r="7" fill="#333"/>
  <circle cx="48" cy="42" r="7" fill="#333"/>
  <circle cx="12" cy="42" r="4" fill="#555"/>
  <circle cx="48" cy="42" r="4" fill="#555"/>
  
  <!-- Diseño multicolor tipo arcoíris -->
  <rect x="18" y="18" width="24" height="2" fill="#ff0000"/>
  <rect x="18" y="20" width="24" height="2" fill="#ff7f00"/>
  <rect x="18" y="22" width="24" height="2" fill="#ffff00"/>
  <rect x="18" y="24" width="24" height="2" fill="#00ff00"/>
  <rect x="18" y="26" width="24" height="2" fill="#0000ff"/>
  <rect x="18" y="28" width="24" height="2" fill="#9400d3"/>
  
  <!-- Estrellas decorativas multicolor -->
  <path d="M 25 20 L 26 22 L 28 22 L 26.5 23.5 L 27 26 L 25 24.5 L 23 26 L 23.5 23.5 L 22 22 L 24 22 Z" fill="#ffd700"/>
  <path d="M 35 22 L 36 24 L 38 24 L 36.5 25.5 L 37 28 L 35 26.5 L 33 28 L 33.5 25.5 L 32 24 L 34 24 Z" fill="#ff00ff"/>
  
  <!-- Número de carreras -->
  <text x="30" y="28" font-family="Arial Black" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold" stroke="#000000" stroke-width="0.5">5</text>
  
  <!-- Suspensión -->
  <rect x="8" y="32" width="3" height="8" fill="#444"/>
  <rect x="49" y="32" width="3" height="8" fill="#444"/>
</svg>
