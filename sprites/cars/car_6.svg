<svg width="60" height="50" xmlns="http://www.w3.org/2000/svg">
  <!-- Monster Truck estilo Hot Wheels - Negro elegante -->
  <!-- Cuerpo principal -->
  <rect x="5" y="15" width="50" height="20" fill="#1a1a1a" rx="3"/>
  <rect x="6" y="16" width="48" height="18" fill="#2d2d2d" rx="2"/>
  
  <!-- Cabina -->
  <rect x="12" y="8" width="18" height="12" fill="#0a0a0a" rx="2"/>
  
  <!-- Ventana -->
  <rect x="14" y="10" width="14" height="8" fill="#1e90ff" rx="1"/>
  <!-- Brillo ventana -->
  <rect x="16" y="11" width="4" height="3" fill="rgba(255,255,255,0.6)"/>
  
  <!-- Ruedas grandes (monster truck) -->
  <circle cx="12" cy="42" r="10" fill="#1a1a1a"/>
  <circle cx="48" cy="42" r="10" fill="#1a1a1a"/>
  <!-- Detalles de ruedas -->
  <circle cx="12" cy="42" r="7" fill="#333"/>
  <circle cx="48" cy="42" r="7" fill="#333"/>
  <circle cx="12" cy="42" r="4" fill="#555"/>
  <circle cx="48" cy="42" r="4" fill="#555"/>
  
  <!-- Rayas plateadas decorativas -->
  <rect x="18" y="18" width="24" height="2" fill="#c0c0c0"/>
  <rect x="18" y="22" width="24" height="2" fill="#c0c0c0"/>
  <rect x="18" y="26" width="24" height="2" fill="#c0c0c0"/>
  
  <!-- Detalles cromados -->
  <rect x="20" y="20" width="20" height="1" fill="#ffffff" opacity="0.5"/>
  <rect x="20" y="24" width="20" height="1" fill="#ffffff" opacity="0.5"/>
  
  <!-- Número de carreras -->
  <text x="30" y="28" font-family="Arial Black" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold" stroke="#000000" stroke-width="0.3">6</text>
  
  <!-- Suspensión -->
  <rect x="8" y="32" width="3" height="8" fill="#444"/>
  <rect x="49" y="32" width="3" height="8" fill="#444"/>
  
  <!-- Reflejos de luz en el cuerpo -->
  <ellipse cx="25" cy="18" rx="8" ry="3" fill="#ffffff" opacity="0.2"/>
  <ellipse cx="35" cy="18" rx="6" ry="2" fill="#ffffff" opacity="0.15"/>
</svg>
