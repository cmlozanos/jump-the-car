<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Engranaje/rueda dentada para configuración -->
  <circle cx="50" cy="50" r="35" fill="#6c757d" stroke="#ffffff" stroke-width="3"/>
  <circle cx="50" cy="50" r="20" fill="#ffffff"/>
  
  <!-- Dientes del engranaje -->
  <rect x="48" y="15" width="4" height="12" rx="2" fill="#ffffff"/>
  <rect x="48" y="73" width="4" height="12" rx="2" fill="#ffffff"/>
  <rect x="15" y="48" width="12" height="4" rx="2" fill="#ffffff"/>
  <rect x="73" y="48" width="12" height="4" rx="2" fill="#ffffff"/>
  
  <!-- Dientes diagonales -->
  <rect x="28" y="28" width="4" height="12" rx="2" fill="#ffffff" transform="rotate(-45 30 34)"/>
  <rect x="68" y="68" width="4" height="12" rx="2" fill="#ffffff" transform="rotate(-45 70 74)"/>
  <rect x="68" y="28" width="4" height="12" rx="2" fill="#ffffff" transform="rotate(45 70 34)"/>
  <rect x="28" y="68" width="4" height="12" rx="2" fill="#ffffff" transform="rotate(45 30 74)"/>
  
  <!-- Centro del engranaje -->
  <circle cx="50" cy="50" r="8" fill="#6c757d"/>
</svg>
