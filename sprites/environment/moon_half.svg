<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Media luna -->
  <defs>
    <radialGradient id="moonHalfGradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f0e68c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.8"/>
    </radialGradient>
    <clipPath id="halfClip">
      <rect x="0" y="0" width="50" height="100"/>
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#moonHalfGradient)" clip-path="url(#halfClip)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#c0c0c0" stroke-width="1" opacity="0.3"/>
  <!-- Cráteres visibles -->
  <circle cx="40" cy="35" r="4" fill="#d4af37" opacity="0.5" clip-path="url(#halfClip)"/>
  <circle cx="45" cy="60" r="3" fill="#d4af37" opacity="0.5" clip-path="url(#halfClip)"/>
  <circle cx="35" cy="45" r="2" fill="#d4af37" opacity="0.5" clip-path="url(#halfClip)"/>
</svg>
