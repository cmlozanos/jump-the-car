<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Luna menguante -->
  <defs>
    <radialGradient id="moonWaningGradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f0e68c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.8"/>
    </radialGradient>
    <clipPath id="waningClip">
      <circle cx="50" cy="50" r="40"/>
      <circle cx="30" cy="50" r="35"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#moonWaningGradient)" clip-path="url(#waningClip)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#c0c0c0" stroke-width="1" opacity="0.3"/>
  <!-- Cráteres visibles -->
  <circle cx="60" cy="45" r="4" fill="#d4af37" opacity="0.5" clip-path="url(#waningClip)"/>
  <circle cx="55" cy="30" r="3" fill="#d4af37" opacity="0.5" clip-path="url(#waningClip)"/>
</svg>
