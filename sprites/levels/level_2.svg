<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- Fondo -->
  <rect width="200" height="150" fill="#98D8C8" rx="10"/>
  
  <!-- Carretera -->
  <rect x="50" y="100" width="100" height="30" fill="#555" rx="5"/>
  <line x1="50" y1="115" x2="150" y2="115" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Pinchos -->
  <polygon points="80,100 85,115 75,115" fill="#dc143c"/>
  <polygon points="120,100 125,115 115,115" fill="#dc143c"/>
  
  <!-- Meta -->
  <rect x="140" y="80" width="20" height="50" fill="#FFD700" rx="3"/>
  
  <!-- Número -->
  <text x="100" y="50" font-size="40" font-weight="bold" fill="#2d3436" text-anchor="middle">2</text>
</svg>
