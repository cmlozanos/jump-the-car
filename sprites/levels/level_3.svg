<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- Fondo -->
  <rect width="200" height="150" fill="#F7DC6F" rx="10"/>
  
  <!-- Carretera -->
  <rect x="50" y="100" width="100" height="30" fill="#555" rx="5"/>
  <line x1="50" y1="115" x2="150" y2="115" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- UFO -->
  <ellipse cx="100" cy="70" rx="20" ry="8" fill="#9370DB"/>
  <ellipse cx="100" cy="70" rx="15" ry="5" fill="#BA55D3"/>
  <circle cx="95" cy="68" r="2" fill="#fff"/>
  <circle cx="105" cy="68" r="2" fill="#fff"/>
  
  <!-- Pinchos -->
