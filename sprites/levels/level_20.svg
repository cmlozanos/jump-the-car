<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- Fondo especial para nivel final -->
  <defs>
    <linearGradient id="finalGradient20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B008B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#finalGradient20)" rx="10"/>
  
  <!-- Carretera -->
  <rect x="50" y="100" width="100" height="30" fill="#555" rx="5"/>
  <line x1="50" y1="115" x2="150" y2="115" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Todos los tipos de obstáculos -->
  <polygon points="60,100 65,115 55,115" fill="#dc143c"/>
  <ellipse cx="75" cy="110" rx="7" ry="11" fill="#FF4500"/>
  <ellipse cx="75" cy="108" rx="5" ry="9" fill="#FF6347"/>
  <ellipse cx="90" cy="115" rx="10" ry="6" fill="#2d3436"/>
  <ellipse cx="105" cy="65" rx="18" ry="6" fill="#9370DB"/>
  <ellipse cx="105" cy="63" rx="16" ry="5" fill="#BA55D3"/>
  <rect x="120" y="100" width="12" height="15" fill="#8b0000" rx="2"/>
  <polygon points="135,100 140,115 130,115" fill="#dc143c"/>
  
  <!-- Meta especial -->
  <rect x="140" y="80" width="20" height="50" fill="#FFD700" rx="3"/>
  <circle cx="150" cy="90" r="5" fill="#fff"/>
  <text x="150" y="95" font-size="12" font-weight="bold" fill="#2d3436" text-anchor="middle">🏆</text>
  
  <!-- Número -->
  <text x="100" y="50" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle" stroke="#2d3436" stroke-width="1">20</text>
</svg>
