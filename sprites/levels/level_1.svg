<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- Fondo -->
  <rect width="200" height="150" fill="#87CEEB" rx="10"/>
  
  <!-- Carretera simple -->
  <rect x="50" y="100" width="100" height="30" fill="#555" rx="5"/>
  <line x1="50" y1="115" x2="150" y2="115" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Meta -->
  <rect x="140" y="80" width="20" height="50" fill="#FFD700" rx="3"/>
  <circle cx="150" cy="90" r="5" fill="#fff"/>
  
  <!-- Número de nivel -->
  <text x="100" y="50" font-size="40" font-weight="bold" fill="#2d3436" text-anchor="middle">1</text>
</svg>
