<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- Fondo -->
  <rect width="200" height="150" fill="#FFE4B5" rx="10"/>
  
  <!-- Carretera -->
  <rect x="50" y="100" width="100" height="30" fill="#555" rx="5"/>
  <line x1="50" y1="115" x2="150" y2="115" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Muchos obstáculos -->
  <polygon points="60,100 65,115 55,115" fill="#dc143c"/>
  <rect x="75" y="100" width="12" height="15" fill="#8b0000" rx="2"/>
  <ellipse cx="95" cy="115" rx="10" ry="6" fill="#2d3436"/>
  <rect x="110" y="100" width="12" height="15" fill="#8b0000" rx="2"/>
  <polygon points="130,100 135,115 125,115" fill="#dc143c"/>
  
  <!-- Meta -->
  <rect x="140" y="80" width="20" height="50" fill="#FFD700" rx="3"/>
  
  <!-- Número -->
  <text x="100" y="50" font-size="40" font-weight="bold" fill="#2d3436" text-anchor="middle">10</text>
</svg>
