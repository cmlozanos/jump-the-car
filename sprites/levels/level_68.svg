  <line x1="50" y1="115" x2="150" y2="115" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Obstáculos representativos -->
  <polygon points="60,100 65,115 55,115" fill="#dc143c"/>
  <ellipse cx="85" cy="70" rx="12" ry="5" fill="#9370DB"/>
    <ellipse cx="85" cy="70" rx="9" ry="4" fill="#BA55D3"/>
  <ellipse cx="110" cy="115" rx="8" ry="5" fill="#2d3436"/>
  <rect x="129" y="100" width="12" height="15" fill="#8b0000" rx="2"/>
  <polygon points="160,100 165,115 155,115" fill="#dc143c"/>
  
